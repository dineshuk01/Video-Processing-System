version: '3.8'

# Two separate applications share one backend image and one data volume:
#   user   -> http://localhost:5000   public streaming site (no admin features at all)
#   admin  -> http://localhost:5001   private dashboard, protected by ADMIN_API_KEY
# Copy .env.example to .env and set ADMIN_API_KEY before starting.

x-app-env: &app-env
  PROVIDER: local
  LOCAL_DATA_DIR: /app/data
  LOCAL_S3_TEMP_BUCKET: s3-temp
  LOCAL_S3_PUBLIC_BUCKET: s3-public
  LOCAL_SQS_QUEUE_NAME: video-processing-queue
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1000}
  ALLOWED_MIME_TYPES: video/mp4,video/quicktime,video/x-matroska

services:
  # --- User app: public site + /api/public + published media ---
  user:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_user_app
    entrypoint: ["node", "dist/index.js"]
    ports:
      - "5000:5000"
    environment:
      <<: *app-env
      PORT: 5000
      APP_MODE: user
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # --- Admin app: dashboard + /api/admin + uploads ---
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_admin_app
    entrypoint: ["node", "dist/index.js"]
    ports:
      - "5001:5000"
    environment:
      <<: *app-env
      PORT: 5000
      APP_MODE: admin
      NODE_ENV: production
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env before starting}
      METRICS_PUBLIC: "true"   # lets the Prometheus container below scrape /metrics
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # --- Background queue worker (runs FFmpeg) ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_background_worker
    entrypoint: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      PORT: 5000
    volumes:
      - ./data:/app/data
    depends_on:
      - admin
    restart: unless-stopped

  # --- Prometheus metrics (reads the admin app; keep port 9090 private) ---
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: video_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - admin
    restart: unless-stopped
