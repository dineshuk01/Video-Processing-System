version: '3.8'

services:
  # --- Express API Server ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_api_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PROVIDER=local
      - LOCAL_DATA_DIR=/app/data
      - LOCAL_S3_TEMP_BUCKET=s3-temp
      - LOCAL_S3_PUBLIC_BUCKET=s3-public
      - LOCAL_SQS_QUEUE_NAME=video-processing-queue
      - MAX_UPLOAD_SIZE_MB=1000
      - ALLOWED_MIME_TYPES=video/mp4,video/quicktime,video/x-matroska
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # --- Background Queue Worker ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_background_worker
    entrypoint: ["node", "dist/worker.js"]
    environment:
      - PORT=5000
      - PROVIDER=local
      - LOCAL_DATA_DIR=/app/data
      - LOCAL_S3_TEMP_BUCKET=s3-temp
      - LOCAL_S3_PUBLIC_BUCKET=s3-public
      - LOCAL_SQS_QUEUE_NAME=video-processing-queue
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  # --- Prometheus Metrics Server ---
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: video_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    restart: unless-stopped
