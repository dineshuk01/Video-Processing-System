<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoStream</title>
  <!-- The player now lives inside the app shell. This keeps old player.html?id=… links working. -->
  <script>
    const id = new URLSearchParams(location.search).get('id');
    location.replace(id ? `/#/watch/${encodeURIComponent(id)}` : '/#/videos');
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/" /></noscript>
</head>
<body></body>
</html>
