<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c15" />
  <title>VideoFlow — Player</title>
  <meta name="description" content="Adaptive HLS video player with quality switching." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>▶️</text></svg>" />
  <!-- Hls.js (pinned version) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#root">Skip to video</a>

  <header class="header">
    <a class="header-brand" href="/">
      <div class="logo-icon" aria-hidden="true">🎬</div>
      VideoFlow
    </a>
    <a class="back-link" href="/">← Back to dashboard</a>
  </header>

  <main class="container" id="root">
    <div class="spinner" id="loader" role="status" aria-label="Loading video"></div>
  </main>

  <script src="common.js"></script>
  <script>
  (() => {
    const { esc, formatBytes, formatDate, formatDuration, toast, copyText } = window.VF;
    const root = document.getElementById('root');
    const videoId = new URLSearchParams(location.search).get('id');
    const POLL_MS = 3000;

    // ─── Simple full-page states ───────────────────────────────
    function showMessage({ icon, title, text, error = false, progress = null, actions = '' }) {
      const bar = progress === null ? '' : `
        <div class="card-progress">
          <div class="card-progress-label"><span>${esc(progress.label)}</span>${progress.pct != null ? `<span>${progress.pct}%</span>` : ''}</div>
          <div class="card-progress-track ${progress.pct == null ? 'indeterminate' : ''}">
            <div class="card-progress-fill ${progress.pct == null ? 'fill-idle' : 'fill-processing'}" ${progress.pct != null ? `style="width:${progress.pct}%"` : ''}></div>
          </div>
        </div>`;
      root.innerHTML = `
        <div class="waiting-card ${error ? 'is-error' : ''}" role="status">
          <div style="font-size:2.5rem">${icon}</div>
          <h2>${esc(title)}</h2>
          <p>${esc(text)}</p>
          ${bar}
          ${actions || '<a href="/" class="btn btn-primary">Back to dashboard</a>'}
        </div>`;
    }

    async function fetchVideo() {
      const res = await fetch(`/api/videos/${encodeURIComponent(videoId)}`);
      const json = await res.json();
      if (!json.success || !json.data) {
        const err = new Error(json.error?.message || 'Video not found');
        err.status = res.status;
        throw err;
      }
      return json.data;
    }

    // Poll until the video is ready, showing live progress instead of a dead end
    async function init() {
      if (!videoId) {
        return showMessage({ icon: '🔗', title: 'No video selected', text: 'The link is missing a video ID.', error: true });
      }
      try {
        const video = await fetchVideo();
        if (video.status === 'COMPLETED' && video.hlsPlaylistUrl) return buildPlayer(video);

        if (video.status === 'FAILED') {
          return showMessage({
            icon: '⚠️', title: 'Processing failed', error: true,
            text: video.error || 'This video could not be transcoded.',
          });
        }
        const pct = video.status === 'PROCESSING' ? Math.round(video.progress || 0) : null;
        showMessage({
          icon: '⚙️', title: 'Your video is being prepared',
          text: 'It will start playing here automatically as soon as it is ready.',
          progress: { label: video.status === 'PROCESSING' ? 'Transcoding…' : 'Waiting in queue…', pct },
        });
        setTimeout(init, POLL_MS);
      } catch (err) {
        showMessage({
          icon: '⚠️', error: true,
          title: err.status === 404 ? 'Video not found' : 'Could not load the video',
          text: err.status === 404 ? 'It may have been deleted.' : err.message,
        });
      }
    }

    // ─── Player ────────────────────────────────────────────────
    function buildPlayer(video) {
      document.title = `${video.originalName} — VideoFlow`;
      const meta = video.metadata;
      const posKey = `vf-pos-${video.id}`;
      const store = {
        get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
        set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignore */ } },
        del: (k) => { try { localStorage.removeItem(k); } catch { /* ignore */ } },
      };

      root.innerHTML = `
        <div class="player-layout">
          <section aria-label="Video player">
            <a class="back-link" href="/">← All videos</a>
            <h1 class="player-title">${esc(video.originalName)}</h1>
            <div class="player-sub">Ready since ${esc(formatDate(video.completedAt))}</div>

            <div class="video-wrap mt-2">
              <video id="hls-video" controls playsinline preload="metadata"
                     ${video.subtitleUrl ? 'crossorigin="anonymous"' : ''}
                     ${video.thumbnailUrl ? `poster="${esc(video.thumbnailUrl)}"` : ''}>
                ${video.subtitleUrl ? `<track kind="subtitles" label="English" srclang="en" src="${esc(video.subtitleUrl)}">` : ''}
              </video>
              <div class="player-overlay" id="overlay-buffering" aria-hidden="true"><div class="spinner"></div></div>
              <div class="player-overlay interactive" id="overlay-error" role="alert">
                <div style="font-size:2rem">⚠️</div>
                <p id="error-text"></p>
                <button class="btn btn-primary btn-sm" id="retry-btn">Try again</button>
              </div>
            </div>

            <div class="controls-bar">
              <div class="control-group">
                <label for="quality-select">Quality</label>
                <select class="select" id="quality-select"><option value="-1">Auto</option></select>
              </div>
              <div class="control-group">
                <label for="speed-select">Speed</label>
                <select class="select" id="speed-select">
                  ${[0.5, 0.75, 1, 1.25, 1.5, 2].map((s) => `<option value="${s}" ${s === 1 ? 'selected' : ''}>${s}×</option>`).join('')}
                </select>
              </div>
              ${video.subtitleUrl ? '<button class="btn btn-ghost btn-sm btn-toggle" id="cc-toggle" aria-pressed="false">💬 Captions: Off</button>' : ''}
            </div>
          </section>

          <aside class="player-sidebar">
            <div class="info-card">
              <h3>Video info</h3>
              <div class="info-row"><span class="info-label">File</span><span class="info-value" title="${esc(video.originalName)}">${esc(video.originalName)}</span></div>
              <div class="info-row"><span class="info-label">Size</span><span class="info-value">${esc(formatBytes(video.fileSize))}</span></div>
              <div class="info-row"><span class="info-label">Type</span><span class="info-value">${esc(video.contentType)}</span></div>
              ${meta ? `
                <div class="info-row"><span class="info-label">Resolution</span><span class="info-value">${esc(meta.width)}×${esc(meta.height)}</span></div>
                <div class="info-row"><span class="info-label">Duration</span><span class="info-value">${meta.duration ? esc(formatDuration(meta.duration)) : '—'}</span></div>
                <div class="info-row"><span class="info-label">Codec</span><span class="info-value">${esc(meta.codec || '—')}</span></div>
                <div class="info-row"><span class="info-label">Frame rate</span><span class="info-value">${meta.fps ? `${esc(meta.fps)} fps` : '—'}</span></div>
                <div class="info-row"><span class="info-label">Bitrate</span><span class="info-value">${meta.bitrate ? `${esc(meta.bitrate)} kbps` : '—'}</span></div>` : ''}
            </div>

            <div class="info-card">
              <h3>Available qualities</h3>
              <div id="streams-list" class="player-sub">Loading…</div>
            </div>

            <div class="info-card">
              <h3>Stream URL</h3>
              <code class="url-box">${esc(video.hlsPlaylistUrl)}</code>
              <button class="btn btn-watch btn-sm" id="copy-url" style="width:100%">📋 Copy stream URL</button>
            </div>

            <div class="info-card">
              <h3>Keyboard shortcuts</h3>
              <div class="shortcuts">
                <span><kbd>Space</kbd> <kbd>K</kbd></span><span>Play / pause</span>
                <span><kbd>←</kbd> <kbd>→</kbd></span><span>Seek 5 seconds</span>
                <span><kbd>J</kbd> <kbd>L</kbd></span><span>Seek 10 seconds</span>
                <span><kbd>↑</kbd> <kbd>↓</kbd></span><span>Volume</span>
                <span><kbd>M</kbd></span><span>Mute</span>
                <span><kbd>F</kbd></span><span>Fullscreen</span>
                ${video.subtitleUrl ? '<span><kbd>C</kbd></span><span>Captions</span>' : ''}
              </div>
            </div>
          </aside>
        </div>`;

      const $ = (id) => document.getElementById(id);
      const videoEl = $('hls-video');
      const qualitySel = $('quality-select');
      const speedSel = $('speed-select');
      const ccBtn = $('cc-toggle');
      const bufferingOverlay = $('overlay-buffering');
      const errorOverlay = $('overlay-error');
      let hls = null;
      let netRetries = 0;
      let mediaRetries = 0;

      $('copy-url').addEventListener('click', () => copyText(video.hlsPlaylistUrl, 'Stream URL copied'));

      // ── Overlays ──
      const setBuffering = (on) => bufferingOverlay.classList.toggle('visible', on);
      function showError(message) {
        setBuffering(false);
        $('error-text').textContent = message;
        errorOverlay.classList.add('visible');
      }
      videoEl.addEventListener('waiting', () => setBuffering(true));
      ['playing', 'canplay', 'pause', 'seeked'].forEach((evt) => videoEl.addEventListener(evt, () => setBuffering(false)));

      // ── Speed (remembered) ──
      const savedSpeed = store.get('vf-speed');
      if (savedSpeed && [...speedSel.options].some((o) => o.value === savedSpeed)) {
        speedSel.value = savedSpeed;
        videoEl.playbackRate = parseFloat(savedSpeed);
      }
      speedSel.addEventListener('change', () => {
        videoEl.playbackRate = parseFloat(speedSel.value);
        store.set('vf-speed', speedSel.value);
      });

      // ── Resume position ──
      let lastSaved = 0;
      videoEl.addEventListener('loadedmetadata', () => {
        const pos = parseFloat(store.get(posKey));
        if (pos > 5 && pos < videoEl.duration - 5) {
          videoEl.currentTime = pos;
          toast(`Resumed from ${formatDuration(pos)}`, 'info', 2500);
        }
        if (videoEl.textTracks[0]) videoEl.textTracks[0].mode = 'disabled';
      }, { once: true });
      videoEl.addEventListener('timeupdate', () => {
        if (Date.now() - lastSaved > 2000) { lastSaved = Date.now(); store.set(posKey, videoEl.currentTime); }
      });
      videoEl.addEventListener('ended', () => store.del(posKey));

      // ── Captions ──
      function setCaptions(on) {
        const track = videoEl.textTracks[0];
        if (!track || !ccBtn) return;
        track.mode = on ? 'showing' : 'disabled';
        ccBtn.setAttribute('aria-pressed', String(on));
        ccBtn.textContent = `💬 Captions: ${on ? 'On' : 'Off'}`;
      }
      if (ccBtn) ccBtn.addEventListener('click', () => setCaptions(ccBtn.getAttribute('aria-pressed') !== 'true'));

      // ── Hls.js ──
      function renderLevels(levels) {
        qualitySel.length = 1; // keep "Auto"
        levels.forEach((level, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `${level.height}p`;
          qualitySel.appendChild(opt);
        });
        $('streams-list').innerHTML = levels.map((l) =>
          `<div class="info-row"><span class="info-label">${esc(l.height)}p</span><span class="info-value">${esc(Math.round(l.bitrate / 1000).toLocaleString())} kbps</span></div>`
        ).join('');
      }

      function startPlayback(resumeAt) {
        errorOverlay.classList.remove('visible');
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true, capLevelToPlayerSize: true });
          hls.loadSource(video.hlsPlaylistUrl);
          hls.attachMedia(videoEl);

          hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
            renderLevels(data.levels);
            if (resumeAt) videoEl.currentTime = resumeAt;
          });
          // Show which quality "Auto" picked
          hls.on(Hls.Events.LEVEL_SWITCHED, (_e, data) => {
            const level = hls.levels[data.level];
            if (level && qualitySel.value === '-1') qualitySel.options[0].textContent = `Auto (${level.height}p)`;
          });
          hls.on(Hls.Events.FRAG_LOADED, () => { netRetries = 0; mediaRetries = 0; });
          hls.on(Hls.Events.ERROR, (_e, data) => {
            if (!data.fatal) return;
            console.error('Hls.js fatal error:', data.type, data.details);
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && netRetries++ < 3) return hls.startLoad();
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries++ < 3) return hls.recoverMediaError();
            hls.destroy();
            showError(data.type === Hls.ErrorTypes.NETWORK_ERROR
              ? 'The connection was lost while loading the video.'
              : 'This video could not be played.');
          });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
          videoEl.src = video.hlsPlaylistUrl; // Safari: native HLS (no manual quality switching)
          qualitySel.closest('.control-group').hidden = true;
          $('streams-list').textContent = 'Managed automatically by your browser.';
        } else {
          showError('Your browser does not support HLS playback.');
        }
      }

      qualitySel.addEventListener('change', () => {
        if (!hls) return;
        hls.currentLevel = parseInt(qualitySel.value, 10);
        if (qualitySel.value !== '-1') qualitySel.options[0].textContent = 'Auto';
      });

      $('retry-btn').addEventListener('click', () => {
        const at = videoEl.currentTime;
        if (hls) hls.destroy();
        netRetries = mediaRetries = 0;
        startPlayback(at);
      });

      startPlayback(0);

      // ── Keyboard shortcuts ──
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        // Let buttons, links and form controls handle their own keys
        if (e.target.closest('button, a, select, input, textarea')) return;
        const key = e.key.toLowerCase();
        // With the video focused the browser already handles these natively
        const nativeKeys = [' ', 'k', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'm', 'f'];
        if (document.activeElement === videoEl && nativeKeys.includes(key)) return;

        const actions = {
          ' ': () => (videoEl.paused ? videoEl.play() : videoEl.pause()),
          k: () => (videoEl.paused ? videoEl.play() : videoEl.pause()),
          arrowleft: () => { videoEl.currentTime = Math.max(0, videoEl.currentTime - 5); },
          arrowright: () => { videoEl.currentTime += 5; },
          j: () => { videoEl.currentTime = Math.max(0, videoEl.currentTime - 10); },
          l: () => { videoEl.currentTime += 10; },
          arrowup: () => { videoEl.volume = Math.min(1, videoEl.volume + 0.1); },
          arrowdown: () => { videoEl.volume = Math.max(0, videoEl.volume - 0.1); },
          m: () => { videoEl.muted = !videoEl.muted; },
          f: () => (document.fullscreenElement ? document.exitFullscreen() : videoEl.parentElement.requestFullscreen()),
          c: () => ccBtn && setCaptions(ccBtn.getAttribute('aria-pressed') !== 'true'),
        };
        if (actions[key]) { e.preventDefault(); actions[key](); }
      });
    }

    init();
  })();
  </script>
</body>
</html>
