<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoFlow — Video Processing Dashboard</title>
  <meta name="description" content="Upload, transcode, and stream adaptive HLS videos with VideoFlow." />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🎬</text></svg>" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/">
      <div class="logo-icon">🎬</div>
      VideoFlow
    </a>
    <div style="display:flex;align-items:center;gap:1.5rem;">
      <span class="live-badge hidden" id="live-badge">Live</span>
      <div class="status-dot">API Connected</div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="container">
    <div style="margin: 2rem 0 2.5rem;">
      <h1 class="page-title">Video Processing Dashboard</h1>
      <p class="page-subtitle">Upload a video to start the adaptive HLS transcoding pipeline.</p>
    </div>

    <!-- ── Upload Section ── -->
    <section class="upload-section">
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept="video/mp4,video/quicktime,video/x-matroska" />
        <div class="upload-icon">📤</div>
        <h3>Drag & drop a video, or click to browse</h3>
        <p>Supports MP4, MOV, MKV · Max 100MB</p>
      </div>

      <!-- Selected file info -->
      <div class="upload-selected hidden" id="upload-selected">
        <div class="file-info">
          <div class="file-name" id="file-name-display">—</div>
          <div class="file-meta" id="file-meta-display">—</div>
        </div>
        <button class="btn btn-primary" id="upload-btn" disabled>
          ⬆ Upload &amp; Transcode
        </button>
      </div>

      <!-- Upload progress -->
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-label">
          <span id="progress-label">Uploading…</span>
          <span></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- ── Video Library ── -->
    <section>
      <div class="section-header">
        <h2 class="section-title">
          🎞 Video Library
          <span class="badge-count" id="total-count">0</span>
        </h2>
      </div>
      <div class="video-grid" id="video-grid">
        <!-- Cards injected by app.js -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
