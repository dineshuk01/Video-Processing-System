<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EternityStream — Wedding Cinema Gallery</title>
  <meta name="description" content="Experience magical wedding films and memories in cinematic adaptive 4K HLS streaming." />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🥂</text></svg>" />
</head>
<body>

  <!-- ── Client Header ── -->
  <header class="header">
    <a class="header-brand" href="/">
      <div class="logo-icon">✨</div>
      <div>
        EternityStream
        <span class="header-subtitle">Wedding Cinema Gallery</span>
      </div>
    </a>
    <div style="display:flex;align-items:center;gap:1.25rem;">
      <a href="/admin" class="btn btn-secondary" style="font-size:0.85rem;padding:0.4rem 1rem;">🔐 Studio Admin</a>
      <div class="status-dot">Live Gallery</div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="container">
    <div style="margin: 2rem 0 2.5rem; text-align:center;">
      <h1 class="page-title">Wedding Cinema &amp; Memories</h1>
      <p class="page-subtitle">Stream 4K wedding highlight films, ceremony vows, and reception memories in smooth adaptive quality.</p>
      
      <!-- Category Filter Pills -->
      <div style="display:flex;justify-content:center;gap:0.75rem;flex-wrap:wrap;margin-top:1.5rem;" id="filter-pills">
        <button class="btn btn-secondary active-pill" data-filter="ALL">✨ All Films</button>
        <button class="btn btn-secondary" data-filter="Highlight">💍 Highlight Reels</button>
        <button class="btn btn-secondary" data-filter="Ceremony">🥂 Full Ceremonies</button>
        <button class="btn btn-secondary" data-filter="Teaser">✨ Teasers</button>
        <button class="btn btn-secondary" data-filter="Reception">🎉 Receptions</button>
      </div>
    </div>

    <!-- ── Completed Video Gallery ── -->
    <section>
      <div class="section-header">
        <h2 class="section-title">
          🎬 Cinema Collection
          <span class="badge-count" id="gallery-count">0</span>
        </h2>
      </div>
      <div class="video-grid" id="client-grid">
        <!-- Injected by client.js -->
      </div>
    </section>
  </main>

  <script src="client.js"></script>
</body>
</html>
