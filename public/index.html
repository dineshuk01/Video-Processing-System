<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>VideoStream</title>
  <meta name="description" content="Upload, transcode and stream adaptive HLS videos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232563eb'/><path d='M9 7l8 5-8 5z' fill='white'/></svg>" />
  <!-- Hls.js (pinned version) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="scrim" id="scrim"></div>

  <div class="shell">
    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
        VideoStream
      </a>

      <nav class="nav">
        <a class="nav-item" href="#/dashboard" data-nav="dashboard"><span class="ico" data-icon="home"></span>Dashboard</a>
        <a class="nav-item" href="#/upload" data-nav="upload"><span class="ico" data-icon="upload"></span>Upload Video<span class="nav-badge hidden" id="nav-upload-badge"></span></a>
        <a class="nav-item" href="#/videos" data-nav="videos"><span class="ico" data-icon="film"></span>My Videos</a>
        <span class="nav-item nav-disabled" aria-disabled="true" title="Live streaming is not available yet"><span class="ico" data-icon="radio"></span>Live Streams<span class="nav-soon">Soon</span></span>
        <a class="nav-item" href="#/jobs" data-nav="jobs"><span class="ico" data-icon="jobs"></span>Processing Jobs<span class="nav-badge hidden" id="nav-jobs-badge"></span></a>
        <a class="nav-item" href="#/settings" data-nav="settings"><span class="ico" data-icon="settings"></span>Settings</a>
      </nav>
    </aside>

    <!-- ── Main column ── -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation"><span class="ico" data-icon="menu"></span></button>
        <label class="topsearch">
          <span class="sr-only">Search videos</span>
          <span class="ico" data-icon="search"></span>
          <input type="search" id="global-search" placeholder="Search videos…" autocomplete="off" />
        </label>
        <div class="topbar-right">
          <div class="conn conn-connecting" id="conn" role="status" title="Live updates connection">
            <span class="conn-dot" aria-hidden="true"></span><span id="conn-label">Connecting…</span>
          </div>
          <div class="bell-wrap">
            <button class="icon-btn bell" id="bell" aria-label="Notifications" aria-expanded="false" aria-haspopup="true">
              <span class="ico" data-icon="bell"></span><span class="bell-badge hidden" id="bell-badge">0</span>
            </button>
            <div class="popover hidden" id="bell-pop" role="dialog" aria-label="Notifications"></div>
          </div>
          <div class="user"><span class="avatar" id="avatar" aria-hidden="true">D</span><span class="user-name" id="user-name">Dinesh</span></div>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
  <script src="upload.js"></script>
  <script src="views.js"></script>
  <script>VF.start();</script>
</body>
</html>
